# 工作流名称：小米CR6608 LEDE 专属 OpenWrt 编译
name: Build LEDE - Xiaomi CR6608

# 触发编译规则
on:
  workflow_dispatch:    # 手动触发（最常用）
  push:                 # 提交代码自动触发
    branches:
      - master

# 编译任务
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      # 1. 拉取 LEDE 源码
      - name: 拉取 LEDE 源码
        uses: actions/checkout@v4
        with:
          repository: coolsnowwolf/lede
          ref: master

      # 2. 安装编译依赖环境
      - name: 初始化编译环境
        run: |
          sudo apt update -y
          sudo apt upgrade -y
          sudo apt install -y build-essential libncurses5-dev libncursesw5-dev \
          git bzip2 flex gawk gcc g++ g++-multilib lib32z1-dev libssl-dev \
          python3 python3-pip unzip zlib1g-dev file wget rsync

      # 3. 添加 OpenClash 源码
      - name: 添加 OpenClash 插件源
        run: |
          git clone https://github.com/vernesong/OpenClash.git package/openclash

      # 4. 更新 Feeds
      - name: 更新 Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 5. 导入 CR6608 配置（只包含 OpenClash）
      - name: 导入设备配置
        run: |
          # 设置目标平台
          echo "CONFIG_TARGET_ramips=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621=y" >> .config
          echo "CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6608=y" >> .config
          
          # 基础配置
          make defconfig
          
          # 无线驱动
          echo "CONFIG_PACKAGE_kmod-mt7915e=y" >> .config
          echo "CONFIG_PACKAGE_kmod-mt7915-firmware=y" >> .config
          
          # LuCI 基础
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-firewall=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-opkg=y" >> .config
          echo "CONFIG_PACKAGE_luci-theme-argon=y" >> .config
          
          # OpenClash（唯一科学上网插件）
          echo "CONFIG_PACKAGE_luci-app-openclash=y" >> .config
          
          # 再次运行 defconfig 解析依赖
          make defconfig

      # 6. 预下载软件包
      - name: 下载依赖
        run: |
          make download -j8

      # 7. 开始编译
      - name: 编译固件
        run: |
          echo "开始编译，使用 $(nproc) 个线程"
          make -j$(nproc) V=s

      # 8. 检查固件是否生成
      - name: 检查固件
        run: |
          echo "检查 bin 目录："
          ls -la bin/targets/ramips/mt7621/ || true
          if ls bin/targets/ramips/mt7621/*-squashfs-sysupgrade.bin 1> /dev/null 2>&1; then
            echo "✅ 固件生成成功"
          else
            echo "❌ 固件未生成，编译可能失败"
            exit 1
          fi

      # 9. 上传固件
      - name: 上传成品固件
        uses: actions/upload-artifact@v4
        with:
          name: LEDE_CR6608_OpenClash_$(date +'%Y%m%d_%H%M%S')
          path: bin/targets/ramips/mt7621/*-squashfs-sysupgrade.bin
          if-no-files-found: error
